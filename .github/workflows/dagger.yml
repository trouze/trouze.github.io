# CI via the dagger-exe skill (committed at .agents/skills/dagger-exe).
#
# Runs every PR against an ephemeral local engine on the runner itself:
# no SSH credentials, no shared VM engine, nothing to rotate.
# (The VM-based vm-check job and the dagger-exe GitHub environment were
# removed from CI; the exe.dev engine is still used from the laptop via
# .agents/skills/dagger-exe.)
name: Dagger

on:
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dagger-pr
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Dagger CLI
        shell: bash
        run: |
          BIN_DIR="$RUNNER_TEMP/dagger-bin" \
            .agents/skills/dagger-exe/scripts/install-cli.sh
          echo "$RUNNER_TEMP/dagger-bin" >> "$GITHUB_PATH"

      - name: Run checks on ephemeral engine
        shell: bash
        env:
          SKILL: .agents/skills/dagger-exe
          # Runner's default Docker context is named `default`.
          DAGGER_DOCKER_CONTEXT: default
          DAGGER_NO_NAG: 1
        run: '"$SKILL/scripts/with-engine.sh" local check'
