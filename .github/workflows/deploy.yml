name: Deploy

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.6

      # Builds into dist/ (the directory wrangler.jsonc serves).
      - run: zola build

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Deploys the site as Workers static assets and attaches the
      # tylerrouze.com custom domain (wrangler.jsonc routes).
      # Static asset deploys invalidate changed assets automatically,
      # so no manual cache purge is needed.
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
