name: Deploy

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Removes stale GitHub Pages DNS records that would block the Workers
      # custom-domain attach (API error 100117 refuses to replace existing
      # records). Only records pointing at GitHub Pages are deleted; the
      # Workers custom domains have been live since 2026-10, so this is a
      # no-op on every subsequent run and can be dropped after a while.
      - name: Remove stale GitHub Pages DNS records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          for name in tylerrouze.com www.tylerrouze.com; do
            curl -sf "${base}?name=${name}&per_page=100" -H "$auth" \
              | jq -r '.result[] | "\(.id) \(.type) \(.content)"' \
              | while read -r id type content; do
                  case "$type:$content" in
                    A:185.199.*|AAAA:2606:50c0:*|CNAME:trouze.github.io*)
                      curl -sf -X DELETE "${base}/${id}" -H "$auth" > /dev/null
                      echo "deleted ${name} ${type} ${content}"
                      ;;
                    *) echo "kept ${name} ${type} ${content}" ;;
                  esac
                done
          done

      # Deploys the site as Workers static assets and attaches the
      # tylerrouze.com custom domain (wrangler.jsonc routes).
      # Static asset deploys invalidate changed assets automatically,
      # so no manual cache purge is needed.
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
